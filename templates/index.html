<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>在外邦人分布ダッシュボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: #121212;
    }

    body {
      margin: 0;
      background: #f7f7f7;
    }

    header {
      background: #111f40;
      color: #fff;
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      flex: 1;
    }

    .controls label,
    .controls select {
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    main {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto 2rem;
      display: grid;
      gap: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 1rem 3rem rgba(14, 25, 47, 0.08);
    }

    #map {
      min-height: 480px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th,
    td {
      text-align: left;
      padding: 0.5rem 0.25rem;
      border-bottom: 1px solid #e5e5e5;
    }

    th {
      font-weight: 600;
      color: #333;
    }

    @media (min-width: 900px) {
      main {
        grid-template-columns: 2fr 1fr;
      }

      #map {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>在外邦人の分布</h1>
    <div class="controls">
      <label for="metric-select">メトリクス：</label>
      <select id="metric-select"></select>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="metric-title">読み込み中...</h2>
      <p id="metric-description" style="margin-top: 0.25rem; color: #555;"></p>
      <div id="map"></div>
    </section>

    <section class="card">
      <h2>地域別集計</h2>
      <table>
        <thead>
          <tr>
            <th>地域</th>
            <th>全体</th>
            <th>長期滞在</th>
            <th>永住</th>
            <th>成人</th>
          </tr>
        </thead>
        <tbody id="region-table-body"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>上位国・地域ランキング</h2>
      <table>
        <thead>
          <tr>
            <th>国・地域</th>
            <th>地域</th>
            <th>選択メトリクス</th>
          </tr>
        </thead>
        <tbody id="ranking-table-body"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="static/main.js"></script>
</body>
</html>
