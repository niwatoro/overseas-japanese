<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>在外邦人分布ダッシュボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", "Noto Sans", sans-serif;
      color: #0b0e14;
      --page-bg: linear-gradient(180deg, #050d1b 0%, #101b2f 45%, #162747 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --accent: #79ffe1;
      --accent-strong: #5ac1ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 10% 20%, rgba(122, 255, 225, 0.15), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(90, 193, 255, 0.25), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      background: rgba(5, 10, 16, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      padding: 1.75rem;
      color: #fff;
      box-shadow: 0 30px 60px rgba(5, 10, 16, 0.6);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      flex: 1 1 320px;
    }

    .eyebrow {
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 0.4rem;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0.5rem 0 0;
      color: rgba(255, 255, 255, 0.75);
      max-width: 520px;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      background: rgba(14, 19, 32, 0.8);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex: 0 0 auto;
    }

    .controls label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.78);
    }

    .controls select {
      font-size: 1rem;
      border: none;
      border-radius: 0.6rem;
      padding: 0.35rem 0.8rem;
      background: linear-gradient(145deg, rgba(121, 255, 225, 0.3), rgba(90, 193, 255, 0.2));
      color: #fff;
      appearance: none;
      min-width: 210px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .controls select:focus {
      outline: 2px solid var(--accent);
      background: rgba(255, 255, 255, 0.2);
    }

    main {
      display: grid;
      gap: 1.75rem;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 30px 60px rgba(5, 10, 16, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 35px 65px rgba(5, 10, 16, 0.45);
    }

    .map-card {
      padding: 1.5rem;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .map-header h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .map-header p {
      margin: 0.4rem 0 0;
      color: #4a4a4a;
      max-width: 520px;
    }

    .metric-badge {
      padding: 0.35rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(5, 10, 16, 0.1);
      background: rgba(121, 255, 225, 0.18);
      align-self: center;
      font-size: 0.9rem;
      color: #023630;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #map {
      min-height: 520px;
      border-radius: 0.75rem;
      overflow: hidden;
      filter: drop-shadow(0 20px 35px rgba(14, 25, 47, 0.45));
    }

    .data-grid {
      display: grid;
      gap: 1.25rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      color: #111;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 0.65rem;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    th,
    td {
      text-align: left;
      padding: 0.65rem 0.6rem;
    }

    th {
      font-weight: 600;
      color: #222;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      background: rgba(5, 10, 16, 0.05);
    }

    tbody tr {
      border-bottom: 1px solid rgba(5, 10, 16, 0.08);
      transition: background 150ms ease;
    }

    tbody tr:nth-child(even) {
      background: rgba(235, 240, 255, 0.65);
    }

    tbody tr:hover {
      background: rgba(90, 193, 255, 0.2);
    }

    @media (min-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }

      .data-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      header h1 {
        font-size: 2.25rem;
      }
    }

    @media (min-width: 1280px) {
      .page {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <p class="eyebrow">在外邦人の分布データ</p>
        <h1>世界の日本人がどこにいるのか</h1>
        <p class="subtitle">
          最新の調査結果をもとに、目的別の在外邦人の分布を直感的に把握できるビジュアルダッシュボードです。
        </p>
      </div>
      <div class="controls">
        <label for="metric-select">メトリクスを切り替える</label>
        <select id="metric-select"></select>
      </div>
    </header>

    <main>
      <section class="card map-card">
        <div class="map-header">
          <div>
            <h2 id="metric-title">読み込み中...</h2>
            <p id="metric-description"></p>
          </div>
          <div class="metric-badge" aria-live="polite">選択中</div>
        </div>
        <div id="map"></div>
      </section>

      <div class="data-grid">
        <section class="card">
          <h2>地域別集計</h2>
          <table>
            <thead>
              <tr>
                <th>地域</th>
                <th>全体</th>
                <th>長期滞在</th>
                <th>永住</th>
                <th>成人</th>
              </tr>
            </thead>
            <tbody id="region-table-body"></tbody>
          </table>
        </section>

        <section class="card">
          <h2>上位国・地域ランキング</h2>
          <table>
            <thead>
              <tr>
                <th>国・地域</th>
                <th>地域</th>
                <th>選択メトリクス</th>
              </tr>
            </thead>
            <tbody id="ranking-table-body"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="static/main.js"></script>
</body>
</html>
