<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>在外邦人分布ダッシュボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", "Noto Sans", sans-serif;
      color: #0b1336;
      --page-bg: #f6f8fb;
      --surface: #ffffff;
      --border: #cbd4e2;
      --muted: #5c6472;
      --accent: #0063af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    header.hero {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-content h1 {
      margin: 0;
      font-size: clamp(2rem, 2.4vw, 2.4rem);
      font-weight: 600;
      color: #0b1336;
    }

    .eyebrow {
      margin: 0;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .subtitle {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 520px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0;
    }

    .controls label {
      font-size: 0.9rem;
      color: #191f3a;
    }

    .controls select {
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.35rem 0.8rem;
      background: var(--surface);
      color: #0b1336;
    }

    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1.25rem;
      box-shadow: none;
    }

    .map-card {
      padding: 0.85rem 0.95rem;
    }

    .map-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .map-meta p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .metric-badge {
      padding: 0.25rem 0.85rem;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: #e7ecf4;
      font-size: 0.75rem;
      color: #0b1336;
      font-weight: 600;
    }

    #map {
      min-height: 720px;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .data-grid {
      display: grid;
      gap: 1rem;
    }

    .ranking-table {
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      color: #0b1336;
      border: 1px solid var(--border);
    }

    th,
    td {
      text-align: left;
      padding: 0.65rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      color: #0b1336;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ranking-table th:nth-child(4),
    .ranking-table td:nth-child(4) {
      text-align: right;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .flag-cell {
      width: 48px;
      text-align: center;
    }

    .flag-img {
      width: 36px;
      height: 24px;
      object-fit: cover;
      border: 1px solid rgba(11, 19, 54, 0.1);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(11, 19, 54, 0.15);
      display: inline-block;
    }

    #region-chart {
      min-height: 360px;
      width: 100%;
    }

    .chart-note {
      margin: 0 0 0.6rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .region-chart-empty {
      margin: 0;
      padding: 1.1rem;
      border: 1px dashed var(--border);
      border-radius: 4px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-content">
        <p class="eyebrow">在外邦人の分布データ</p>
        <h1>世界の日本人がどこにいるか</h1>
        <p class="subtitle">令和7年10月1日現在の「海外在留邦人調査」から抽出した基本データを表示。</p>
      </div>
      <div class="controls">
        <label for="metric-select">表示メトリクス</label>
        <select id="metric-select"></select>
      </div>
    </header>

    <main>
      <section class="card map-card">
        <div id="map"></div>
      </section>

      <div class="data-grid">
        <section class="card">
          <h2>地域別集計</h2>
          <p class="chart-note">全体在留邦人数を地域ごとにドーナツグラフで表示します。</p>
          <div id="region-chart"></div>
        </section>

        <section class="card">
          <h2>上位国・地域ランキング</h2>
          <table class="ranking-table">
            <thead>
              <tr>
                <th>国旗</th>
                <th>国・地域</th>
                <th>地域</th>
                <th>選択メトリクス</th>
              </tr>
            </thead>
            <tbody id="ranking-table-body"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="static/main.js"></script>
</body>
</html>
