<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>在外邦人分布ダッシュボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-content">
        <p class="eyebrow">在外邦人の分布データ</p>
        <h1>日本人はどこにいるのか</h1>
        <p class="subtitle">出所：海外在留邦人調査</p>
      </div>
      <div class="controls">
        <label for="metric-select">表示メトリクス</label>
        <select id="metric-select"></select>
      </div>
    </header>

    <main>
      <section class="card map-card">
        <div id="map"></div>
      </section>

      <div class="data-grid">
        <section class="card">
          <h2>地域別集計</h2>
          <p class="chart-note">全体在留邦人数を地域ごとにドーナツグラフで表示します。</p>
          <div id="region-chart"></div>
        </section>

        <section class="card">
          <h2>上位国・地域ランキング</h2>
          <table class="ranking-table">
            <thead>
              <tr>
                <th>国旗</th>
                <th>国・地域</th>
                <th>地域</th>
                <th>選択メトリクス</th>
              </tr>
            </thead>
            <tbody id="ranking-table-body"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="static/main.js"></script>
</body>
</html>
